<div class="auth-container" dir="rtl">
  <div class="auth-card">
    <!-- هيدر الشعار -->
    <div class="auth-header">
      <h2>Bloomy</h2>
      <p>متجر الورود والهدايا</p>
    </div>

    <!-- أزرار التبويبة (تسجيل الدخول / إنشاء حساب) -->
    <div class="auth-tabs">
      <button 
        [class.active]="isLoginMode" 
        (click)="isLoginMode = true" type="button">
        تسجيل الدخول
      </button>
      <button 
        [class.active]="!isLoginMode" 
        (click)="isLoginMode = false" type="button">
        إنشاء حساب
      </button>
    </div>

    <!-- نموذج تسجيل الدخول -->
    <form *ngIf="isLoginMode" (ngSubmit)="onLogin()" class="auth-form">
      <div class="input-group">
        <label>البريد الإلكتروني</label>
        <input type="email" [(ngModel)]="loginData.email" name="email" placeholder="example@domain.com" required>
      </div>

      <div class="input-group password-group">
        <label>كلمة المرور</label>
        <div class="password-wrapper" style="position: relative;">
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="loginData.password" name="password" placeholder="********" required style="width: 100%;">
          <button type="button" (click)="togglePasswordVisibility()" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #994b94; font-weight: bold;">
            {{ showPassword ? 'إخفاء' : 'إظهار' }}
          </button>
        </div>
      </div>

      <div class="auth-options">
        <label class="remember-me">
          <input type="checkbox"> تذكرني
        </label>
        <a href="#" class="forgot-password">نسيت كلمة المرور؟</a>
      </div>

      <button type="submit" class="submit-btn">تسجيل الدخول</button>

      <div class="divider">أو</div>

      <div class="social-login">
        <button type="button" class="social-btn google">Google</button>
        <button type="button" class="social-btn apple">Apple</button>
      </div>
    </form>

    <!-- نموذج إنشاء حساب -->
    <form *ngIf="!isLoginMode" (ngSubmit)="onRegister()" class="auth-form">
      <div class="input-group">
        <label>الاسم الكامل</label>
        <input type="text" [(ngModel)]="registerData.fullName" name="fullName" placeholder="اسمك الكريم" required>
      </div>

      <div class="input-group">
        <label>البريد الإلكتروني</label>
        <input type="email" [(ngModel)]="registerData.email" name="email" placeholder="example@domain.com" required>
      </div>

      <div class="input-group">
        <label>رقم الهاتف</label>
        <input type="tel" [(ngModel)]="registerData.phone" name="phone" placeholder="05xxxxxxxx" required>
      </div>

      <div class="input-group password-group">
        <label>كلمة المرور</label>
        <div class="password-wrapper" style="position: relative;">
          <input [type]="showRegisterPassword ? 'text' : 'password'" [(ngModel)]="registerData.password" name="registerPassword" placeholder="********" required style="width: 100%;">
          <button type="button" (click)="toggleRegisterPasswordVisibility()" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #994b94; font-weight: bold;">
            {{ showRegisterPassword ? 'إخفاء' : 'إظهار' }}
          </button>
        </div>
      </div>

      <button type="submit" class="submit-btn">إنشاء حساب جديد</button>
    </form>
  </div>
</div>
